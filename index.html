<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safe Place - File Storage</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📁</text></svg>">
</head>
<body>
    <!-- Google Sign-In Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-card">
            <div class="login-icon">📁</div>
            <h1>Safe Place</h1>
            <p>Your personal file storage on Google Drive</p>
            <div class="login-form">
                <button id="signin-btn" class="btn btn-google">
                    <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Sign in with Google
                </button>
            </div>
            <div id="login-status" class="status"></div>
        </div>
    </div>

    <!-- Main App -->
    <div id="app" class="container" style="display:none;">
        <header>
            <div class="header-row">
                <h1>📁 Safe Place</h1>
                <div class="header-actions">
                    <span id="user-email" class="user-email"></span>
                    <button id="signout-btn" class="btn btn-small btn-danger">Sign Out</button>
                </div>
            </div>
        </header>

        <!-- Upload Section -->
        <div class="card">
            <h2>📤 Upload Files</h2>
            <div id="drop-zone" class="drop-zone">
                <p>Drag & drop files here<br>or click to browse</p>
                <input type="file" id="file-input" multiple hidden>
            </div>
            <div id="upload-progress" class="progress-list"></div>
        </div>

        <!-- File Browser -->
        <div class="card">
            <div class="files-header">
                <h2>📁 Files</h2>
                <div class="files-actions">
                    <button id="new-folder-btn" class="btn btn-small">+ Folder</button>
                    <button id="refresh-btn" class="btn btn-small">↻ Refresh</button>
                </div>
            </div>
            <div id="breadcrumb" class="breadcrumb"></div>
            <div id="file-list" class="file-list">
                <p class="empty-state">Loading files...</p>
            </div>
        </div>

        <footer>
            <p>Files are stored in your Google Drive "SafePlace" folder.</p>
            <p style="margin-top:0.5rem;font-size:0.75rem;color:#888;">&copy; <a href="https://dat5ngon.github.io" style="color:#888;text-decoration:underline;">dat5ngon</a></p>
        </footer>
    </div>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="app.js"></script>
</body>
</html>
